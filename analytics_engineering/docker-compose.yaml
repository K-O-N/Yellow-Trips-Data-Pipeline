version: '3'
services:
  nytaxi-dtc:
    build:
      context: .
      dockerfile: Dockerfile
      target: dbt-bigquery
    image: dbt/bigquery
    working_dir: /usr/app/analytics_engineering
    volumes:
      - .:/usr/app
      - ./credentials/google_credentials.json:/credentials/google_credentials.json

    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/google_credentials.json
    network_mode: host
  